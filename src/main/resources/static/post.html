<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 - 팀 스터디 게시판</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header><a class="logo" href="/index.html">📝 팀 스터디 게시판</a></header>
<main>
  <p id="error" class="error" hidden></p>
  <article id="post" hidden>
    <h1 id="title"></h1>
    <p class="meta"><span id="author"></span> · <span id="createdAt"></span><span id="edited" hidden> (수정됨)</span></p>
    <div class="content" id="content"></div>
    <div class="actions">
      <a class="btn" href="/index.html">목록</a>
      <a class="btn" id="editLink">수정</a>
      <button class="btn danger" id="deleteBtn" type="button">삭제</button>
    </div>
  </article>

  <section class="comments" id="comments" hidden>
    <h2>댓글 <span class="badge" id="commentCount">0</span></h2>
    <ul id="commentList"></ul>
    <p id="commentError" class="error" hidden></p>
    <form id="commentForm" class="comment-form">
      <input type="text" id="commentAuthor" placeholder="작성자">
      <textarea id="commentContent" rows="3" placeholder="댓글을 입력하세요"></textarea>
      <button class="btn primary" type="submit">댓글 등록</button>
    </form>
  </section>
</main>
<script src="/js/api.js"></script>
<script>
  const postId = queryId();

  // GET /api/posts/{id} -> { id, title, author, content, createdAt, updatedAt,
  //                          comments: [{ id, author, content, createdAt }] }
  async function load() {
    try {
      const post = await api('GET', '/api/posts/' + postId);
      document.title = post.title + ' - 팀 스터디 게시판';
      document.getElementById('title').textContent = post.title;
      document.getElementById('author').textContent = post.author;
      document.getElementById('createdAt').textContent = formatDate(post.createdAt);
      document.getElementById('edited').hidden = post.updatedAt === post.createdAt;
      document.getElementById('content').textContent = post.content;
      document.getElementById('editLink').href = '/form.html?id=' + post.id;
      renderComments(post.comments || []);
      document.getElementById('post').hidden = false;
      document.getElementById('comments').hidden = false;
      showError('');
    } catch (e) {
      showError(e.message);
    }
  }

  function renderComments(comments) {
    document.getElementById('commentCount').textContent = comments.length;
    const ul = document.getElementById('commentList');
    ul.replaceChildren();
    if (comments.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty'; li.textContent = '첫 댓글을 남겨보세요.';
      ul.appendChild(li);
      return;
    }
    for (const c of comments) {
      const li = document.createElement('li');
      const meta = document.createElement('div');
      meta.className = 'meta';
      const strong = document.createElement('strong');
      strong.textContent = c.author;
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'link-danger'; del.textContent = '삭제';
      del.addEventListener('click', () => deleteComment(c.id));
      meta.append(strong, ' · ' + formatDate(c.createdAt), del);
      const p = document.createElement('p');
      p.textContent = c.content;
      li.append(meta, p);
      ul.appendChild(li);
    }
  }

  document.getElementById('deleteBtn').addEventListener('click', async () => {
    if (!confirm('게시글을 삭제할까요? 댓글도 함께 삭제됩니다.')) return;
    try {
      // DELETE /api/posts/{id}
      await api('DELETE', '/api/posts/' + postId);
      location.href = '/index.html';
    } catch (e) {
      showError(e.message);
    }
  });

  document.getElementById('commentForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const err = document.getElementById('commentError');
    err.hidden = true;
    try {
      // POST /api/posts/{postId}/comments  body: { author, content }
      await api('POST', '/api/posts/' + postId + '/comments', {
        author: document.getElementById('commentAuthor').value,
        content: document.getElementById('commentContent').value,
      });
      document.getElementById('commentContent').value = '';
      load();
    } catch (e) {
      err.textContent = e.message; err.hidden = false;
    }
  });

  async function deleteComment(commentId) {
    if (!confirm('댓글을 삭제할까요?')) return;
    try {
      // DELETE /api/posts/{postId}/comments/{commentId}
      await api('DELETE', '/api/posts/' + postId + '/comments/' + commentId);
      load();
    } catch (e) {
      showError(e.message);
    }
  }

  load();
</script>
</body>
</html>
